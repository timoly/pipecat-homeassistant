# Pipecat Assist satellite, running on a Raspberry Pi with a USB speakerphone.
#
#   cp config.example.toml ~/.config/pipecat-satellite.toml
#   chmod 600 ~/.config/pipecat-satellite.toml
#
# The URL comes from the add-on's Runtime tab, under "ESPHome satellite". It
# carries the shared secret, so keep this file private and out of any commit.
url = "ws://homeassistant.local:7860/api/assist/esphome?token=CHANGE_ME&flow_id=default"

# ALSA device names. Prefer CARD= over a number: card indexes move between boots.
# `arecord -l` and `aplay -l` list what this machine has.
capture_device = "plughw:CARD=PowerConf"
playback_device = "plughw:CARD=PowerConf"

# Software gain on what the add-on receives. Leave it at 1.0 until a
# measurement says otherwise: an Anker PowerConf runs its own automatic gain and
# reaches 20000-28000 of full scale from normal speech across a room, where any
# multiplier clips the loudest part of every sentence. With log_level = "DEBUG"
# the capture level is reported once a second and says CLIPPING when it does.
# Aim for a peak between 8000 and 20000 after gain.
capture_gain = 1.0

# Keep the microphone open while the assistant speaks, so it can be interrupted.
# Only leave this on when the speakerphone cancels its own echo well — otherwise
# the assistant hears itself and interrupts itself.
barge_in = true

# A short blip when a conversation opens. The add-on deliberately stays silent
# until you have said something — a greeting you did not ask for is billed live
# audio — so this is the only sign that the wake word landed.
wake_chime = true

# The longest one conversation may run before the satellite stops it. Every
# other limit is armed by something the add-on says, and a live model that keeps
# reporting a reply finished and then speaking again pushes those forward; this
# is the one it cannot move, so it is what bounds the worst case on the bill.
max_conversation_secs = 180.0

log_level = "INFO"

# Wake word. Empty means the keyboard starts conversations.
#   pip install pyopen-wakeword
# Built-in phrases: okay_nabu, hey_jarvis, hey_mycroft, alexa, hey_rhasspy.
# "okay_nabu" is what a Home Assistant Voice PE answers to, so a house with both
# keeps one wake word. A path to a .tflite file uses a model of your own instead.
wake_word_model = ""
# The wake word has its own gain, since the two models are not level invariant
# and need not want the same amount. Start at 1.0 here too and raise it only if
# the detector's best score stays low: gain is not a free improvement, and too
# much of it clips speech into distortion and costs detections.
wake_word_gain = 1.0
# Raise this if the satellite wakes on its own, lower it if it misses you. Run
# with log_level = "DEBUG" to see the scores it almost accepted.
wake_word_threshold = 0.5
# Seconds of deafness after a detection, so one word cannot wake it twice.
wake_word_cooldown_secs = 2.0
